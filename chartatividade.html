<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementando Chartjs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .chart-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
        }
    </style>
</head>
<body>

    <h2>Implementando ChartJs - Dashboard</h2>

    <div class="dashboard-container">
        <div class="chart-box">
            <canvas id="graficoLinhas"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

    <script>
        const ctxLinhas = document.getElementById('graficoLinhas').getContext('2d');
        const graficoLinhas = new Chart(ctxLinhas, {
            type: 'line',
            data: {
                labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
                datasets: [
                    {
                        label: 'Temperatura',
                        data: [30, 29, 28, 25, 22, 23],
                        borderColor: '#ff6384',
                        backgroundColor: '#ff6384',
                        tension: 0.1
                    },
                    {
                        label: 'Humidade',
                        data: [80, 82, 80, 85, 80, 83],
                        borderColor: '#36a2eb',
                        backgroundColor: '#36a2eb',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Temperatura e Humidade por Horário'
                    }
                }
            }
        });

        const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
        const graficoBarras = new Chart(ctxBarras, {
            type: 'bar',
            data: {
                labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
                datasets: [
                    {
                        label: 'Temperatura Média',
                        data: [22, 24, 27, 23, 20, 18],
                        backgroundColor: '#ff6384'
                    },
                    {
                        label: 'Humidade Média',
                        data: [90, 89, 93, 87, 88, 82],
                        backgroundColor: '#36a2eb'
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Temperatura Média e Humidade Média por Mês'
                    }
                }
            }
        });
    </script>

</body>
</html>
